<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blockbuster: The Movie Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="logo">
      <span class="logo-block">BLOCK</span><span class="logo-buster">BUSTER</span>
      <span class="logo-sub">the movie game</span>
    </div>
    <div class="topbar-actions">
      <button id="howToPlayBtn" class="icon-btn" title="How to play" aria-label="How to play">❓</button>
      <button id="muteBtn" class="icon-btn" title="Mute sound" aria-label="Mute sound">🔊</button>
      <button id="newGameBtn" class="ghost-btn" hidden>New Game</button>
    </div>
  </header>

  <main id="app"></main>

  <footer class="footer">
    A browser tribute to the party game <em>Blockbuster</em> — play with friends in the same room.
  </footer>

  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal-box" role="dialog" aria-modal="true">
      <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
